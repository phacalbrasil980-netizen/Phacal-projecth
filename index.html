<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ester — O Pequeno Príncipe</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@600&family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cursive: ['Alex Brush', 'cursive'],
                        handwritten: ['Caveat', 'cursive'],
                        serif: ['EB Garamond', 'serif'],
                        cinzel: ['Cinzel', 'serif']
                    },
                    colors: {
                        starlight: '#fef3c7',
                        vintagePaper: '#fbf4e8',
                        deepSpace: '#060814',
                        roseRed: '#e11d48',
                        goldGlow: '#fbbf24'
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #060814;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Starfield Background */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); filter: drop-shadow(0 0 6px rgba(254, 243, 199, 0.9)); }
        }

        /* Deep Ambient Space Glow */
        .space-glow {
            position: fixed;
            width: min(650px, 92vw);
            height: min(650px, 92vw);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(225, 29, 72, 0.15) 40%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 2;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.18); opacity: 0.9; }
        }

        /* Vintage Parchment Letter Styling */
        .vintage-card {
            background: #f8f1e5;
            background-image: radial-gradient(#e2d3bd 1.2px, transparent 0);
            background-size: 22px 22px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 40px rgba(251, 191, 36, 0.25);
            border: 1px solid #cca16e;
        }

        .ink-writing {
            color: #2b1e19;
            text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.12);
        }

        .rose-glow {
            filter: drop-shadow(0 0 15px rgba(225, 29, 72, 0.75)) drop-shadow(0 0 30px rgba(244, 63, 94, 0.5));
        }

        /* Custom Stamp Effect */
        .postage-stamp {
            border: 3px dashed #b08d57;
            padding: 4px;
            background: #fffdf9;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transform: rotate(3deg);
        }

        /* Custom Scrollbar for Poem */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(212, 190, 156, 0.3);
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #b08d57;
            border-radius: 10px;
        }

        @keyframes roseBloom {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .animate-bloom {
            animation: roseBloom 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Intro Screen Animations */
        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6)) drop-shadow(0 0 35px rgba(225, 29, 72, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 50px rgba(225, 29, 72, 0.7)); }
        }

        .glow-title {
            animation: titleGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative select-none">

    <div class="stars-container" id="starsContainer"></div>
    <div class="space-glow"></div>

    <!-- Intro Splash Screen -->
    <div id="introScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#060814] transition-opacity duration-1000 p-6 text-center">
        <div class="space-y-4 max-w-lg">
            <span class="text-amber-300/70 font-cinzel text-xs md:text-sm tracking-[0.3em] uppercase block animate-pulse">
                Uma mensagem especial do universo
            </span>
            <h1 class="font-cursive text-7xl md:text-9xl text-amber-200 font-bold tracking-wide glow-title my-2">
                Ester
            </h1>
            <p class="font-serif italic text-amber-100/70 text-base md:text-lg max-w-xs mx-auto">
                "Foi o tempo que dedicaste à tua rosa que a fez tão importante."
            </p>
            <div class="pt-8">
                <button id="enterBtn" class="bg-gradient-to-r from-amber-600 via-rose-600 to-amber-600 hover:from-amber-500 hover:to-rose-500 text-white font-cinzel font-semibold text-xs md:text-sm px-8 py-3.5 rounded-full shadow-2xl border border-amber-300/40 transform transition-all hover:scale-105 active:scale-95 flex items-center gap-2 mx-auto">
                    ✨ Entrar no Asteroide B-612
                </button>
            </div>
        </div>
    </div>

    <!-- Main Interactive Stage Container -->
    <main class="relative z-10 w-full max-w-4xl px-4 py-6 flex flex-col items-center justify-between min-h-screen">
        
        <!-- Header Banner & Audio Control -->
        <header class="w-full flex flex-col md:flex-row items-center justify-between gap-4 mt-2 px-2">
            <div class="text-center md:text-left">
                <span class="text-amber-200/70 text-xs font-cinzel tracking-widest uppercase block">
                    Asteroide B-612
                </span>
                <h1 class="text-xl md:text-2xl font-serif italic text-amber-100/90 tracking-wide">
                    "Tu tornas-te eternamente responsável por aquilo que cativas."
                </h1>
            </div>

            <!-- Custom Music Controller -->
            <div class="bg-amber-950/40 backdrop-blur-md border border-amber-500/30 rounded-full px-4 py-2 flex items-center gap-3 shadow-lg">
                <button id="audioToggleBtn" class="w-8 h-8 rounded-full bg-rose-600/80 hover:bg-rose-500 text-amber-100 flex items-center justify-center transition-colors">
                    <span id="audioIcon">🎵</span>
                </button>
                <div class="text-left pr-2">
                    <span id="audioStatusText" class="text-[11px] font-cinzel text-amber-200 block leading-tight">
                        Música do Especial
                    </span>
                    <span class="text-[9px] text-amber-300/60 block">
                        Toque para ligar/desligar
                    </span>
                </div>
            </div>
        </header>

        <!-- Fixed Local Background Audio File -->
        <audio id="bgAudio" src="musica.mp3" loop></audio>

        <!-- Center Interactive Stage -->
        <div id="stageContainer" class="relative w-full max-w-md aspect-square flex items-center justify-center my-auto">
            
            <!-- B-612 Planet Surface SVG -->
            <svg class="absolute bottom-0 w-full h-2/3 drop-shadow-[0_10px_30px_rgba(0,0,0,0.95)]" viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="planetGrad" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#3b3355" />
                        <stop offset="60%" stop-color="#1f1a30" />
                        <stop offset="100%" stop-color="#0f0c1b" />
                    </radialGradient>
                    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#fdba74" />
                        <stop offset="100%" stop-color="#7c2d12" />
                    </linearGradient>
                    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                </defs>

                <!-- Asteroide Ground -->
                <path d="M 20,180 Q 200,80 380,180 Q 390,220 200,220 Q 10,220 20,180 Z" fill="url(#planetGrad)" stroke="#524373" stroke-width="1.5"/>
                
                <!-- Volcanos -->
                <polygon points="110,135 120,120 130,135" fill="url(#volcanoGrad)" />
                <ellipse cx="120" cy="120" rx="5" ry="2" fill="#ef4444" filter="url(#softGlow)"/>
                
                <polygon points="280,145 290,132 300,145" fill="url(#volcanoGrad)" />
                <ellipse cx="290" cy="132" rx="4" ry="1.5" fill="#f97316" filter="url(#softGlow)"/>

                <!-- Sprouts -->
                <path d="M 80,150 Q 75,138 70,135 Q 78,136 82,150 Z" fill="#15803d" />
                <path d="M 320,160 Q 325,148 330,145 Q 323,147 318,160 Z" fill="#15803d" />

                <!-- Craters -->
                <ellipse cx="200" cy="170" rx="35" ry="10" fill="#151226" stroke="#2e2646" stroke-width="1"/>
                <ellipse cx="250" cy="185" rx="20" ry="6" fill="#151226" stroke="#2e2646" stroke-width="1"/>
            </svg>

            <!-- Prince & Envelope Wrapper -->
            <div class="relative z-20 flex flex-col items-center justify-center -mt-8">
                
                <!-- The Little Prince Character -->
                <div id="princeCharacter" class="relative transition-transform duration-500 hover:scale-105 cursor-pointer">
                    <svg class="w-44 h-52 md:w-52 md:h-60" viewBox="0 0 200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Scarf -->
                        <path d="M 105,95 Q 140,85 175,98 Q 150,110 105,102 Z" fill="#f59e0b" filter="drop-shadow(0 0 4px rgba(245, 158, 11, 0.6))">
                            <animate attributeName="d" 
                                values="M 105,95 Q 140,85 175,98 Q 150,110 105,102 Z; 
                                        M 105,95 Q 145,100 180,90 Q 145,115 105,102 Z; 
                                        M 105,95 Q 140,85 175,98 Q 150,110 105,102 Z" 
                                dur="4s" repeatCount="indefinite" />
                        </path>

                        <!-- Boots -->
                        <path d="M 82,170 L 80,210 L 92,212 L 94,170 Z" fill="#1e293b"/>
                        <path d="M 106,170 L 104,210 L 116,212 L 118,170 Z" fill="#1e293b"/>

                        <!-- Green Tunic -->
                        <path d="M 75,95 L 125,95 L 130,172 L 70,172 Z" fill="#15803d" stroke="#166534" stroke-width="2"/>
                        <rect x="70" y="132" width="60" height="8" fill="#f59e0b" rx="2"/>
                        <circle cx="100" cy="136" r="5" fill="#ef4444"/>

                        <!-- Arms -->
                        <path d="M 72,100 Q 55,125 80,135" stroke="#15803d" stroke-width="10" stroke-linecap="round"/>
                        <path d="M 128,100 Q 145,125 120,135" stroke="#15803d" stroke-width="10" stroke-linecap="round"/>

                        <!-- Hands -->
                        <circle cx="80" cy="135" r="6" fill="#fde047"/>
                        <circle cx="120" cy="135" r="6" fill="#fde047"/>

                        <!-- Head & Hair -->
                        <circle cx="100" cy="72" r="20" fill="#fef08a"/>
                        <path d="M 80,70 Q 75,48 95,50 Q 100,42 110,50 Q 125,48 120,70 Q 125,75 118,80 Q 100,85 82,78 Z" fill="#eab308"/>
                        <path d="M 88,58 Q 92,45 102,52 Q 112,42 118,56" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>

                        <!-- Face -->
                        <circle cx="93" cy="72" r="2" fill="#451a03"/>
                        <circle cx="107" cy="72" r="2" fill="#451a03"/>
                        <path d="M 96,79 Q 100,82 104,79" stroke="#451a03" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                    </svg>
                </div>

                <!-- Sealed Vintage Envelope -->
                <div id="sealedEnvelope" 
                     class="group relative -mt-16 cursor-pointer transform transition-all duration-300 hover:scale-105 z-30 flex flex-col items-center">
                    
                    <div class="absolute -inset-2 bg-gradient-to-r from-amber-500/30 via-rose-500/40 to-amber-500/30 rounded-xl blur-md opacity-80 group-hover:opacity-100 transition-opacity"></div>

                    <div class="relative w-56 h-36 md:w-64 md:h-40 bg-[#e8d5b7] rounded-lg shadow-2xl border-2 border-[#c2a679] flex flex-col items-center justify-center p-3 overflow-hidden">
                        
                        <div class="absolute top-0 left-0 w-full h-full pointer-events-none">
                            <svg class="w-full h-full" viewBox="0 0 256 160" fill="none">
                                <path d="M 0,0 L 128,80 L 256,0" fill="none" stroke="#c2a679" stroke-width="2.5"/>
                            </svg>
                        </div>

                        <!-- Handwritten Calligraphy for Ester -->
                        <div class="text-center z-10 pt-2">
                            <span class="text-[10px] uppercase font-cinzel text-amber-900/60 tracking-widest block">Para a minha estrela</span>
                            <h2 class="font-cursive text-4xl md:text-5xl text-rose-950 font-bold ink-writing tracking-wide my-0.5">
                                Ester
                            </h2>
                        </div>

                        <!-- Red Wax Seal Icon -->
                        <div class="absolute -bottom-2 bg-gradient-to-br from-rose-600 to-rose-900 w-9 h-9 rounded-full border-2 border-amber-300 shadow-lg flex items-center justify-center group-hover:scale-110 transition-transform">
                            <svg class="w-4 h-4 text-amber-200" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" />
                            </svg>
                        </div>
                    </div>

                    <button id="openBtn" class="mt-5 bg-gradient-to-r from-amber-600 via-rose-600 to-amber-600 hover:from-amber-500 hover:to-rose-500 text-white font-cinzel font-semibold text-xs md:text-sm px-6 py-2.5 rounded-full shadow-lg border border-amber-300/40 transform transition-all active:scale-95 flex items-center gap-2">
                        ✨ Toque para abrir a carta
                    </button>
                </div>

            </div>
        </div>

        <!-- Poetic Letter Modal Overlay -->
        <div id="letterModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-500">
            
            <div class="relative w-full max-w-lg md:max-w-xl">
                
                <!-- Close Button -->
                <button id="closeBtn" class="absolute -top-12 right-0 text-amber-200 hover:text-white text-xs md:text-sm font-cinzel flex items-center gap-1.5 bg-amber-950/80 px-4 py-2 rounded-full border border-amber-500/40 transition-all hover:border-amber-300 shadow-xl active:scale-95">
                    ✕ Fechar carta
                </button>

                <!-- Vintage Parchment Paper -->
                <div class="vintage-card rounded-2xl p-6 md:p-8 relative overflow-hidden text-amber-950 transition-all transform scale-90 duration-500" id="letterCard">
                    
                    <!-- Decorative Vintage Corner Accents -->
                    <div class="absolute top-3 left-3 w-7 h-7 border-t-2 border-l-2 border-amber-800/40 rounded-tl"></div>
                    <div class="absolute top-3 right-3 w-7 h-7 border-t-2 border-r-2 border-amber-800/40 rounded-tr"></div>
                    <div class="absolute bottom-3 left-3 w-7 h-7 border-b-2 border-l-2 border-amber-800/40 rounded-bl"></div>
                    <div class="absolute bottom-3 right-3 w-7 h-7 border-b-2 border-r-2 border-amber-800/40 rounded-br"></div>

                    <!-- Stamp Photo Holder & Glowing Rose Header -->
                    <div class="flex items-start justify-between mb-4 border-b border-amber-800/20 pb-4">
                        
                        <!-- Glowing Rose -->
                        <div class="flex items-center gap-3">
                            <svg id="roseSvg" class="w-16 h-16 md:w-20 md:h-20 rose-glow flex-shrink-0" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M 50,45 Q 48,70 52,90" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
                                <path d="M 50,65 Q 35,60 30,50 Q 42,52 50,65 Z" fill="#166534"/>
                                <path d="M 51,72 Q 65,68 70,58 Q 58,60 51,72 Z" fill="#166534"/>
                                <circle cx="50" cy="38" r="18" fill="#e11d48"/>
                                <path d="M 38,32 C 38,20 62,20 62,32 C 62,45 38,45 38,32 Z" fill="#f43f5e"/>
                                <path d="M 44,28 C 44,18 56,18 56,28 C 56,38 44,38 44,28 Z" fill="#be123c"/>
                                <path d="M 48,25 Q 50,20 52,25 Q 55,30 50,34 Q 45,30 48,25 Z" fill="#fda4af"/>
                            </svg>
                            <div>
                                <span class="text-[10px] font-cinzel tracking-widest text-amber-900/70 uppercase block">Asteroide B-612</span>
                                <h1 class="font-cursive text-5xl md:text-6xl text-rose-950 font-bold ink-writing my-0">
                                    Ester,
                                </h1>
                            </div>
                        </div>

                        <!-- Fixed Local Postage Stamp Photo Slot -->
                        <div class="postage-stamp flex-shrink-0 relative">
                            <img id="esterPhoto" src="foto_ester.jpg" onError="this.onerror=null; this.src='https://placehold.co/120x150/fdfbf7/881337?text=Foto+Ester';" alt="Foto Ester" class="w-14 h-18 object-cover rounded-sm border bor
