<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ester | O Pequeno Príncipe & O Asteroide B-612</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #fef08a;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-light: #faf9f5;
            --text-dark: #1e1e1e;
            --accent-red: #e11d48;
            --prince-green: #2d6a4f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Interactive Canvas for Physics & Dynamic Particles */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #ffffff 0%, #faf9f0 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 25px;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s ease;
        }

        #intro-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-aura {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulseAura 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulseAura {
            0%, 100% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 0.9; }
        }

        .intro-title {
            font-family: 'Alex Brush', cursive;
            font-size: 6.5rem;
            color: #111111;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.6), 0 0 50px rgba(212, 175, 55, 0.2);
            position: relative;
            z-index: 10;
            margin-bottom: 5px;
            animation: floatText 5s infinite ease-in-out;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .intro-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: #555555;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-style: italic;
            position: relative;
            z-index: 10;
        }

        .intro-btn {
            position: relative;
            z-index: 10;
            background: #111111;
            color: #ffffff;
            border: 2px solid var(--gold);
            padding: 16px 42px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 0 20px var(--gold-glow);
            overflow: hidden;
        }

        .intro-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .intro-btn:hover::before {
            left: 100%;
        }

        .intro-btn:hover {
            background: var(--gold);
            color: #111111;
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4);
        }

        .audio-control {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #111;
            font-size: 0.9rem;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }

        .audio-control:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.2);
        }

        .pulse-icon {
            color: var(--gold);
            animation: spinMusic 8s linear infinite;
        }

        @keyframes spinMusic {
            100% { transform: rotate(360deg); }
        }

        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            margin: 20px auto;
        }

        .card-box {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 45px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.05), 0 0 40px rgba(212, 175, 55, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .prince-stage {
            width: 280px;
            height: 290px;
            margin: 0 auto 10px auto;
            position: relative;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.08));
            cursor: pointer;
            transition: transform 0.4s ease;
        }

        .prince-stage:hover {
            transform: scale(1.03);
        }

        .prince-svg {
            width: 100%;
            height: 100%;
            animation: gentleFloat 6s infinite ease-in-out;
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .card-header-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #111111;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .card-header-subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            color: #666666;
            font-style: italic;
            margin-top: 4px;
        }

        .envelope-wrapper {
            perspective: 1000px;
            margin: 35px 0 20px 0;
            cursor: pointer;
        }

        .envelope-3d {
            position: relative;
            background: linear-gradient(145deg, #ffffff, #faf7f0);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .envelope-3d:hover {
            border-color: var(--gold);
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.25);
            transform: translateY(-5px);
        }

        .recipient-tag {
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #888888;
            text-transform: uppercase;
            font-weight: 500;
        }

        .recipient-name-large {
            font-family: 'Alex Brush', cursive;
            font-size: 4.8rem;
            color: #111111;
            margin: 5px 0;
            line-height: 1;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .wax-seal-btn {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #e11d48 0%, #9f1239 100%);
            border-radius: 50%;
            margin: 15px auto 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
            color: #ffffff;
            font-size: 1.4rem;
            border: 2px solid #fecdd3;
            transition: transform 0.3s ease;
        }

        .envelope-3d:hover .wax-seal-btn {
            transform: scale(1.12) rotate(12deg);
        }

        .open-trigger-btn {
            background: #111111;
            color: #ffffff;
            border: 1px solid var(--gold);
            padding: 14px 36px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .open-trigger-btn:hover {
            background: var(--gold);
            color: #111111;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .letter-content {
            display: none;
            opacity: 0;
            background: #fffdfa;
            color: #222222;
            padding: 50px 35px 40px 35px;
            border: 1px solid #ebd9b4;
            border-radius: 8px;
            margin-top: 30px;
            text-align: left;
            position: relative;
            box-shadow: 0 15px 45px rgba(0,0,0,0.06);
            transform-origin: top center;
        }

        .letter-content.active {
            display: block;
            animation: unfoldLetter 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes unfoldLetter {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Antique Stamp Frame */
        .stamp-holder {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 85px;
            height: 110px;
            background: #ffffff;
            border: 2px dashed #d4af37;
            padding: 5px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            transform: rotate(4deg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .stamp-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        .stamp-holder::after {
            content: 'B-612';
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            background: rgba(255,255,255,0.8);
            padding: 1px 3px;
        }

        .poem-heading {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.7rem;
            font-weight: 700;
            color: #111111;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--gold-light);
            padding-bottom: 12px;
            width: 60%;
        }

        .poem-body {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25rem;
            line-height: 1.95;
            color: #2c2c2c;
        }

        .poem-body p {
            margin-bottom: 20px;
        }

        .signature-block {
            margin-top: 40px;
            font-family: 'Alex Brush', cursive;
            font-size: 2.8rem;
            color: #111111;
            text-align: right;
            text-shadow: 0 0 5px rgba(212, 175, 55, 0.2);
        }

        @media (max-width: 600px) {
            .intro-title { font-size: 4.8rem; }
            .recipient-name-large { font-size: 3.8rem; }
            .prince-stage { width: 230px; height: 240px; }
            .card-box { padding: 30px 20px; }
            .letter-content { padding: 35px 20px 30px 20px; }
            .stamp-holder { width: 70px; height: 90px; top: 15px; right: 15px; }
            .poem-heading { width: 55%; font-size: 1.35rem; }
            .poem-body { font-size: 1.1rem; line-height: 1.8; }
            .audio-control { top: 15px; right: 15px; padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <div id="intro-screen">
        <div class="intro-aura"></div>
        <div class="intro-title">Ester</div>
        <div class="intro-subtitle">Um refúgio no Asteroide B-612</div>
        <button class="intro-btn" id="start-btn">Entrar no Asteroide</button>
    </div>

    <div class="audio-control" id="audio-toggle">
        <i class="fa-solid fa-compact-disc pulse-icon" id="audio-icon"></i>
        <span id="audio-text">Tocar Música</span>
    </div>

    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div class="main-container">
        <div class="card-box">
            
            <!-- Exact Classic Little Prince Illustration in SVG -->
            <div class="prince-stage" id="prince-interactive" title="Clique no Pequeno Príncipe para criar estrelas!">
                <svg class="prince-svg" viewBox="0 0 300 320" preserveAspectRatio="xMidYMid meet">
                    <defs>
                        <!-- Hair Gradient -->
                        <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f97316"/>
                            <stop offset="50%" stop-color="#fbbf24"/>
                            <stop offset="100%" stop-color="#f59e0b"/>
                        </linearGradient>
                        <!-- Coat Outer Green -->
                        <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#2d6a4f"/>
                            <stop offset="100%" stop-color="#1b4332"/>
                        </linearGradient>
                        <!-- Coat Inner Red Lining -->
                        <linearGradient id="liningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ef4444"/>
                            <stop offset="100%" stop-color="#b91c1c"/>
                        </linearGradient>
                    </defs>

                    <!-- Shadow Base -->
                    <ellipse cx="150" cy="295" rx="55" ry="8" fill="rgba(0,0,0,0.08)"/>

                    <!-- Sword -->
                    <!-- Blade -->
                    <path d="M 215 210 Q 220 250 216 280 L 212 280 Q 212 250 211 210 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8"/>
                    <!-- Guard & Hilt -->
                    <path d="M 200 210 C 205 218 220 218 225 210" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="212" cy="207" r="4" fill="#fbbf24"/>

                    <!-- Left Arm / Hand on Sword -->
                    <path d="M 180 135 L 208 200 L 198 205 L 172 145 Z" fill="url(#coatGrad)"/>
                    <path d="M 198 205 C 203 207 208 202 208 198" fill="#fdecce" stroke="#d97706" stroke-width="0.8"/>

                    <!-- Inner Red Lining Body Backing -->
                    <path d="M 110 115 L 190 115 L 220 280 L 80 280 Z" fill="url(#liningGrad)"/>

                    <!-- White Trousers / Shirt Base -->
                    <path d="M 125 110 L 175 110 L 170 260 L 130 260 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

                    <!-- Golden Sash / Belt -->
                    <rect x="128" y="175" width="44" height="14" fill="#fbbf24" rx="2" stroke="#d97706" stroke-width="0.8"/>

                    <!-- Legs & Shoes -->
                    <path d="M 134 250 L 132 285 L 144 285 L 146 250 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                    <path d="M 154 250 L 154 285 L 166 285 L 164 250 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8"/>
                    <ellipse cx="138" cy="286" rx="8" ry="3.5" fill="#1e293b"/>
                    <ellipse cx="160" cy="286" rx="8" ry="3.5" fill="#1e293b"/>

                    <!-- Main Outer Green Coat Flaps -->
                    <!-- Left Coat Flap -->
                    <path d="M 125 110 C 100 130 80 180 75 280 C 100 270 120 230 130 185 Z" fill="url(#coatGrad)"/>
                    <path d="M 125 110 C 115 140 115 180 130 185 L 125 110 Z" fill="url(#liningGrad)"/>

                    <!-- Right Coat Flap -->
                    <path d="M 175 110 C 200 130 220 180 225 280 C 200 270 180 230 170 185 Z" fill="url(#coatGrad)"/>
                    <path d="M 175 110 C 185 140 185 180 170 185 L 175 110 Z" fill="url(#liningGrad)"/>

                    <!-- Right Arm / Hand on Hip -->
                    <path d="M 125 115 L 98 160 L 115 185 L 128 175 L 112 155 L 132 125 Z" fill="url(#coatGrad)"/>
                    <path d="M 115 185 Q 120 190 124 182" fill="#fdecce" stroke="#d97706" stroke-width="0.8"/>

                    <!-- Sleeves Red Cuffs -->
                    <ellipse cx="106" cy="170" rx="10" ry="6" fill="url(#liningGrad)" transform="rotate(-20 106 170)"/>
                    <ellipse cx="192" cy="182" rx="10" ry="6" fill="url(#liningGrad)" transform="rotate(30 192 182)"/>

                    <!-- White Ruffled Cloud Collar (Classic Detail) -->
                    <path d="M 130 110 C 120 100 130 85 150 85 C 170 85 180 100 170 110 C 160 120 140 120 130 110 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
                    <circle cx="150" cy="100" r="7" fill="#94a3b8" opacity="0.3"/>

                    <!-- Star Epaulettes (On Shoulders) -->
                    <!-- Left Shoulder Star -->
                    <g transform="translate(112, 106) scale(0.7)">
                        <path d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z" fill="#fbbf24" stroke="#d97706" stroke-width="0.8"/>
                    </g>
                    <!-- Right Shoulder Star -->
                    <g transform="translate(188, 106) scale(0.7)">
                        <path d="M
